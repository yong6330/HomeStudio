<!--body class="bg-background font-body-md text-body-md text-on-surface min-h-screen flex flex-col"-->
<header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-on-surface hover:bg-surface-variant/30 active:scale-95 transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><img alt="HomeStudio" class="hs-brand-lockup" src="assets/homestudio-wordmark.svg"><h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Email Login</h1></div><a href="#welcome" aria-label="계정" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></a></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-background"><div class="flex flex-col w-full pb-8">
<!-- Subtle Ambient Glow -->
<div class="relative w-full overflow-hidden">
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-72 h-44 bg-primary/10 blur-3xl pointer-events-none rounded-full"></div>
</div>
<!-- Header Welcome Greeting Section -->
<div class="flex flex-col pt-3 pb-6">
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-high w-fit mb-3">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">야간 안심 모니터링 케어</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight whitespace-pre-line leading-snug">HomeStudio 계정으로
로그인해주세요</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5">등록된 이메일 주소와 비밀번호를 입력해주세요.</p>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-4" id="login-form" novalidate>
<!-- Email Field (Valid State) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="email">
<span>이메일</span>
<span class="hidden font-label-sm text-label-sm text-primary flex items-center gap-0.5" id="email-ok">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
          확인됨
        </span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center justify-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full h-13 py-3.5 pl-11 pr-11 rounded-xl bg-surface-container text-on-surface font-body-md text-body-md focus:outline-none focus:bg-surface-container-high transition-colors" id="email" placeholder="이메일을 입력하세요" type="email" autocomplete="username" required/>
<div class="hidden absolute right-3.5 flex items-center justify-center pointer-events-none text-primary" id="email-ok-icon">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
<!-- Password Field (Active Error State) -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="password" id="pw-label">비밀번호</label>
<span class="hidden font-label-sm text-label-sm text-error/90" id="pw-count"></span>
</div>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center justify-center pointer-events-none text-on-surface-variant" id="pw-lock">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-13 py-3.5 pl-11 pr-12 rounded-xl bg-surface-container text-on-surface font-body-md text-body-md focus:outline-none focus:bg-surface-container-high transition-all tracking-wider" id="password" placeholder="비밀번호" type="password" autocomplete="current-password" required/>
<button aria-label="비밀번호 보기 토글" class="absolute right-2.5 w-9 h-9 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-all" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwdIcon">visibility_off</span>
</button>
</div>
<!-- Inline Explicit Error Validation -->
<div class="hidden flex items-start gap-1.5 mt-1 px-1 py-1.5 rounded-lg bg-error-container/30" id="login-error">
<span class="material-symbols-outlined text-[17px] text-error shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-sm text-body-sm text-on-error-container leading-tight">
          <span data-k="login_error">이메일 또는 비밀번호가 일치하지 않습니다.</span> <span class="text-error font-medium">(5회 실패 시 15분 잠금)</span>
</p>
</div>
</div>
<!-- Options Row: Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-1 pb-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none py-1">
<input class="peer sr-only" id="rememberMe" type="checkbox"/>
<div class="w-5 h-5 rounded-md bg-surface-container peer-checked:bg-primary-container flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[15px] text-on-primary font-bold opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-on-surface">로그인 상태 유지</span>
</label>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors py-1" id="btn-forgot" type="button">
        비밀번호를 잊으셨나요?
      </button>
</div>
<!-- Primary Login Button -->
<button class="w-full h-[52px] mt-2 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0_4px_16px_rgba(52,211,153,0.2)] hover:opacity-95 active:scale-[0.99] transition-all" type="submit">
<span>로그인</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider Section -->
<div class="relative my-7 flex items-center justify-center">
<div class="w-full h-px bg-surface-variant/70"></div>
<span class="absolute px-3 bg-background font-label-sm text-label-sm text-outline">또는 간편 인증</span>
</div>
<!-- Quick PIN Card / Shortcut -->
<div class="flex flex-col gap-3">
<button class="w-full p-4 rounded-2xl bg-surface-container hover:bg-surface-container-high active:scale-[0.99] transition-all flex items-center justify-between text-left group" id="btn-pin" type="button">
<div class="flex items-center gap-3.5">
<div class="w-11 h-11 rounded-xl bg-surface-bright flex items-center justify-center text-primary group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[24px]">dialpad</span>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-1.5">
<span class="font-label-lg text-label-lg text-on-surface">가족 간편 PIN (4자리) 로그인</span>
<span class="px-1.5 py-0.5 rounded-full bg-primary/15 text-primary font-label-sm text-[10px] leading-none">빠름</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">기기에 사전 등록된 PIN으로 즉시 입장</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface group-hover:translate-x-0.5 transition-all text-[20px]">chevron_right</span>
</button>
</div>
<!-- Subtle Caregiver Reassurance Card -->
<div class="mt-5 p-3.5 rounded-xl bg-surface-container-low flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-tertiary shrink-0">
<span class="material-symbols-outlined text-[18px]">bedtime</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface font-semibold truncate"><span data-k="now">--:--</span> 현재 HomeStudio 상태</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">로그인하면 오늘의 활동 기록을 볼 수 있어요</span>
</div>
</div>
<!-- Bottom Navigation / Signup Helper -->
<div class="mt-8 pt-2 flex items-center justify-center gap-1 text-center">
<span class="font-body-md text-body-md text-on-surface-variant">계정이 없으신가요?</span>
<button class="font-label-lg text-label-lg text-primary hover:underline transition-all ml-1" id="btn-signup" type="button">
      회원가입하기
    </button>
</div>
</div>
</main>
