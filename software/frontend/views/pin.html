<!--body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen pt-safe pb-safe"-->
<main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-10">
<!-- Brand Intro & Cozy Ambience -->
<div class="flex flex-col items-center text-center pt-8 pb-6">
<div class="relative mb-4 group cursor-pointer">
<div class="absolute -inset-2 bg-primary/20 rounded-full blur-xl opacity-70 transition duration-700"></div>
<img alt="" class="hs-brand-splash relative" src="assets/homestudio-logo.svg">
</div>
<h1 class="sr-only">HomeStudio</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[260px] leading-relaxed">
      반려 햄스터의 밤과 낮을 함께하는<br>따스한 전용 홈 케어
    </p>
</div>
<!-- Main Login Card Container -->
<div class="w-full bg-surface-container rounded-[24px] p-6 shadow-xl flex flex-col items-center">
<!-- Header inside Card -->
<div class="flex items-center gap-2 mb-1.5 self-start">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">nightlight_round</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">HomeStudio 접속</h2>
</div>
<p class="font-body-sm text-body-sm text-secondary self-start mb-6">
      <span data-k="pin_sub">가구 전용 간편 PIN 4~6자리를 입력해주세요.</span>
    </p>
<!-- PIN Visual Dots Display -->
<div class="flex items-center justify-center gap-4 py-3 mb-6 w-full bg-surface-container-low rounded-2xl" id="pin-dots"></div>
<!-- Cozy Soft Numeric Keypad -->
<div class="grid grid-cols-3 gap-y-3.5 gap-x-5 w-full max-w-[280px] mb-6">
<!-- 1 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="1" type="button">
        1
      </button>
<!-- 2 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="2" type="button">
        2
      </button>
<!-- 3 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="3" type="button">
        3
      </button>
<!-- 4 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="4" type="button">
        4
      </button>
<!-- 5 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="5" type="button">
        5
      </button>
<!-- 6 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="6" type="button">
        6
      </button>
<!-- 7 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="7" type="button">
        7
      </button>
<!-- 8 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="8" type="button">
        8
      </button>
<!-- 9 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="9" type="button">
        9
      </button>
<!-- Biometric quick tap -->
<button aria-label="확인" class="h-14 rounded-full bg-primary-container/20 hover:bg-surface-container-high text-primary active:scale-95 transition-all flex items-center justify-center" id="bio-quick-btn" type="button">
<span class="material-symbols-outlined text-[26px]">check</span>
</button>
<!-- 0 -->
<button class="keypad-btn h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-95 active:bg-primary/20 text-on-surface font-headline-md text-headline-md transition-all flex items-center justify-center" data-val="0" type="button">
        0
      </button>
<!-- Backspace -->
<button aria-label="한 글자 지우기" class="h-14 rounded-full bg-surface-container-low hover:bg-surface-container-high text-on-surface-variant active:scale-95 transition-all flex items-center justify-center" id="btn-backspace" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>
</div>
<div class="hidden flex items-start gap-1.5 mb-3 w-full px-1 py-1.5 rounded-lg bg-error-container/30" id="pin-error"><span class="material-symbols-outlined text-[17px] text-error shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span><p class="font-body-sm text-body-sm text-on-error-container leading-tight" data-k="pin-error"></p></div>
<!-- Face ID Action Banner -->
<button class="w-full h-12 rounded-xl bg-surface-container-high hover:bg-surface-bright text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-2.5 transition active:scale-[0.98]" id="faceid-btn" type="button" disabled>
<span class="material-symbols-outlined text-primary text-[22px]">familiar_face_and_zone</span>
<span class="">Face ID로 빠른 로그인 (준비 중)</span>
</button>
</div>
<!-- Auxiliary Friendly Nav / Help Options -->
<div class="flex flex-col items-center gap-3.5 mt-6 w-full">
<button class="flex items-center gap-1.5 text-secondary hover:text-primary transition py-1 text-center font-label-md text-label-md" id="btn-invite" type="button">
<span class="material-symbols-outlined text-[18px]">group_add</span>
<span class="">가족 초대 코드로 시작하기</span>
</button>
<div class="flex items-center gap-3 text-outline">
<button class="text-on-surface-variant hover:text-on-surface transition font-label-sm text-label-sm" id="btn-forgot" type="button">
        PIN 번호를 잊으셨나요?
      </button>
<span class="w-1 h-1 rounded-full bg-surface-variant"></span>
<button class="text-on-surface-variant hover:text-on-surface transition font-label-sm text-label-sm" id="btn-login" type="button">
        일반 계정 로그인
      </button>
</div>
</div>
<!-- Bottom Pet Status Subtle Toast/Feedback -->
<div class="mt-8 mx-auto flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-body-sm text-body-sm text-secondary"><span data-k="toast">HomeStudio 카메라 대기 중</span></span>
</div>
</div>
</main>
