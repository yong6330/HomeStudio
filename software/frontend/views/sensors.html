<!--body class="hs-desktop hs-sensors bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen"-->
<header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.2)] pt-safe"><div class="h-16 px-margin flex items-center gap-space-sm"><a href="#settings" aria-label="설정으로" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-high"><span class="material-symbols-outlined">arrow_back_ios_new</span></a><div><h1 class="font-headline-sm text-headline-sm font-semibold">Wi-Fi 센서</h1><p class="font-label-sm text-on-surface-variant">연결된 보드와 배치</p></div></div></header>
<main class="hs-main flex flex-col w-full pt-16 pb-24"><div class="hs-sensor-content flex flex-col gap-space-md px-margin py-space-md">
<div id="sensor-error" class="hidden p-3 rounded-lg bg-error-container/20 text-on-surface" role="alert"><p class="font-body-sm" data-k="message"></p></div>
<p id="sensor-saved" data-k="sensor_saved" class="hidden p-3 rounded-lg bg-primary/10 text-on-surface font-body-sm" role="status">보드를 목록에 추가했어요.</p>
<section id="sensor-discovery" class="p-space-lg rounded-[20px] bg-surface-container shadow-sm flex flex-col gap-space-sm"><div class="flex items-center justify-between gap-space-sm"><div><h2 class="font-headline-sm font-semibold">보드 찾기</h2><p class="font-body-sm text-on-surface-variant" data-k="sensor_discovery_status">USB로 연결된 보드를 검색해요.</p></div><button id="sensor-discover" type="button" class="shrink-0 min-h-[48px] px-space-md rounded-xl bg-primary text-on-primary font-label-md font-semibold">보드 찾기</button></div>
<p id="sensor-discovery-empty" data-k="sensor_discovery_empty" class="hidden p-space-md rounded-xl bg-surface-container-low font-body-sm">연결된 보드를 찾지 못했어요. USB 연결 후 다시 찾아주세요.</p>
<div id="sensor-candidates" class="hidden flex flex-col gap-space-sm"><h3 class="font-label-md font-semibold">찾은 USB 장치</h3><div class="hs-report-list"><article data-tpl="candidate" class="p-space-md rounded-xl bg-surface-container-low flex flex-col gap-2"><div class="flex flex-wrap items-start justify-between gap-2"><div class="min-w-0"><h4 class="font-label-lg font-semibold break-all" data-k="candidate_product"></h4><p class="font-body-sm text-on-surface-variant break-all" data-k="candidate_port"></p><p class="font-label-sm text-on-surface-variant break-all" data-k="candidate_identity"></p><p class="font-label-sm text-on-surface-variant" data-k="candidate_ids"></p></div><button type="button" data-select class="shrink-0 min-h-[44px] px-space-md rounded-lg bg-surface-container-high font-label-md">선택</button></div><p class="font-label-sm text-on-surface-variant hidden" data-k="candidate_registered"></p></article></div></div>
</section>
<section class="p-space-lg rounded-[20px] bg-surface-container shadow-sm flex flex-col gap-space-sm"><div class="flex items-center justify-between gap-2"><h2 class="font-headline-sm font-semibold">등록된 보드</h2><button id="sensor-retry" type="button" class="min-h-[44px] px-3 rounded-lg bg-surface-container-high font-label-sm">새로고침</button></div><p id="sensor-empty" class="hidden font-body-sm text-on-surface-variant">등록된 보드가 없어요.</p><div class="hs-report-list"><article data-tpl="sensor" class="p-space-md rounded-xl bg-surface-container-low flex flex-col gap-2"><div class="flex flex-wrap items-start justify-between gap-2"><div><h3 class="font-label-lg font-semibold break-all" data-k="sensor_name"></h3><p class="font-body-sm text-on-surface-variant" data-k="sensor_model"></p></div><span class="rounded-full bg-surface-container-high px-2 py-1 font-label-sm" data-k="sensor_status"></span></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-1 text-body-sm"><span data-k="sensor_role"></span><span data-k="sensor_location"></span><span data-k="sensor_direction"></span><span data-k="sensor_height"></span></div><button type="button" data-edit class="self-start min-h-[44px] px-3 rounded-lg bg-surface-container-high font-label-sm">배치 수정</button></article></div></section>
<section id="sensor-placement-section" class="hidden p-space-lg rounded-[20px] bg-surface-container shadow-sm flex flex-col gap-space-sm"><div><h2 class="font-headline-sm font-semibold" data-k="sensor_form_title">선택한 보드 배치</h2><p class="font-body-sm text-on-surface-variant" data-k="sensor_selected_identity"></p></div><form id="sensor-form" class="grid grid-cols-1 sm:grid-cols-2 gap-space-sm">
<label class="flex flex-col gap-1 font-label-sm">이름<input name="name" required maxlength="80" autocomplete="off" class="min-h-[44px] rounded-lg bg-surface-container-low px-3 text-on-surface"></label>
<label class="flex flex-col gap-1 font-label-sm">역할<select name="role" required class="min-h-[44px] rounded-lg bg-surface-container-low px-3"><option value="" selected disabled>역할 선택</option><option value="transmitter">송신 보드</option><option value="receiver">수신 보드</option></select></label>
<label class="flex flex-col gap-1 font-label-sm">위치<input name="location" maxlength="200" class="min-h-[44px] rounded-lg bg-surface-container-low px-3" placeholder="케이지 기준 위치"></label>
<label class="flex flex-col gap-1 font-label-sm">높이<input name="height" maxlength="100" class="min-h-[44px] rounded-lg bg-surface-container-low px-3" placeholder="예: 바닥에서 20cm"></label>
<label class="flex flex-col gap-1 font-label-sm">방향<input name="direction" maxlength="100" class="min-h-[44px] rounded-lg bg-surface-container-low px-3" placeholder="예: 케이지 안쪽을 향함"></label>
<label class="flex flex-col gap-1 font-label-sm">상대 보드<select name="peer_sensor_id" id="sensor-peer"><option value="">지정하지 않음</option></select></label>
<label class="sm:col-span-2 flex flex-col gap-1 font-label-sm">메모<textarea name="notes" maxlength="500" rows="3" class="rounded-lg bg-surface-container-low p-3"></textarea></label>
<button type="submit" class="sm:col-span-2 min-h-[48px] rounded-xl bg-primary text-on-primary font-label-md font-semibold">보드 등록</button></form></section>
</div></main>
<nav aria-label="주 메뉴" class="hs-primary-nav fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl"><div class="flex justify-around items-center h-16 px-space-md"><a data-path="home" href="#home">홈</a><a data-path="timeline" href="#timeline">타임라인</a><a data-path="status" href="#status">상태</a><a data-path="settings" href="#settings">설정</a></div></nav>
