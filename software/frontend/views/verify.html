<!--body class="bg-background font-body-md text-body-md text-on-surface min-h-screen flex flex-col"-->
<header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-on-surface hover:bg-surface-variant/30 active:scale-95 transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><img alt="HomeStudio" class="hs-brand-lockup" src="assets/homestudio-wordmark.svg"><h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Pet Profile Setup</h1></div><div class="flex items-center gap-space-sm"><a href="#welcome" aria-label="계정" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></a></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-background"><div class="flex flex-col w-full pb-8">
<!-- Progress Header -->
<div class="flex flex-col gap-space-xs mt-2 mb-space-lg">
<div class="flex items-center justify-between text-label-sm font-label-sm text-on-surface-variant">
<span class="flex items-center gap-1 font-semibold text-primary">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">mark_email_unread</span>
        이메일 인증
      </span>
<span class="tracking-widest font-mono text-secondary" data-k="step">2 / 5 단계</span>
</div>
<!-- Step progress bar (40% filled) -->
<div class="w-full h-1.5 rounded-full bg-surface-container-high overflow-hidden">
<div class="h-full rounded-full bg-primary-container transition-all duration-500 ease-out" id="step-bar" style="width: 40%;"></div>
</div>
</div>
<!-- Warm Nocturnal Mascot & Mail Visual -->
<div class="flex flex-col items-center justify-center my-space-sm text-center">
<div class="relative flex items-center justify-center mb-space-md">
<!-- Ambient Nocturnal Glow -->
<div class="absolute -inset-4 rounded-full bg-primary/10 blur-xl"></div>
<!-- Visual Card Pill -->
<div class="relative w-24 h-24 rounded-3xl bg-surface-container-high flex items-center justify-center shadow-lg shadow-black/40">
<div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center relative overflow-hidden">
<div class="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-primary/20 blur-sm"></div>
<span class="material-symbols-outlined text-primary text-[36px]" style="font-variation-settings: 'FILL' 1;">mail_lock</span>
</div>
<!-- Little Pet Slumber Indicator Tag -->
<div class="absolute -bottom-1 -right-1 px-2 py-0.5 rounded-full bg-surface-container-lowest text-tertiary-fixed text-[10px] font-label-sm flex items-center gap-0.5 shadow-md">
<span class="material-symbols-outlined text-[11px]" style="font-variation-settings: 'FILL' 1;">bedtime</span>
<span>야행성 케어</span>
</div>
</div>
</div>
<!-- Title & Subtitle -->
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-1.5">
      인증 메일을 보냈어요
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
      보내드린 6자리 인증 코드를 입력해주세요.
    </p>
</div>
<!-- Email Target Card with Change Action -->
<div class="mt-space-md mb-space-lg w-full bg-surface-container rounded-2xl p-space-md flex items-center justify-between shadow-sm">
<div class="flex items-center gap-space-sm min-w-0 pr-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined text-[18px]">alternate_email</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant">보낸 곳</span>
<span class="font-label-lg text-label-lg text-on-surface truncate font-mono" data-k="email"></span>
</div>
</div>
<button id="btn-change" class="shrink-0 h-9 px-3 rounded-full bg-surface-container-high text-on-surface text-label-sm font-label-sm hover:bg-surface-variant active:scale-95 transition-all flex items-center gap-1" type="button">
<span>변경</span>
<span class="material-symbols-outlined text-[14px]">edit</span>
</button>
</div>
<!-- 6-Digit Code Input Section -->
<div class="flex flex-col items-center w-full mb-space-md">
<div class="flex items-center justify-between w-full max-w-[340px] gap-2 cursor-text" id="code-boxes"></div>
<!-- Hidden Native Input for Functional Accessibility and Typing -->
<input aria-label="6자리 이메일 인증번호" class="opacity-0 absolute -z-10 w-px h-px" id="authCodeInput" inputmode="numeric" maxlength="6" type="text" autocomplete="one-time-code"/>
</div>
<!-- Timer & Resend Component -->
<div class="w-full flex flex-col items-center gap-space-sm mt-space-xs mb-space-lg">
<!-- Countdown Pill -->
<div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-surface-container text-tertiary-fixed font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">timer</span>
<span>남은 시간</span>
<span class="font-mono font-semibold tracking-wider text-primary ml-0.5" id="timerClock">10:00</span>
</div>
<!-- Re-send Link -->
<div class="flex items-center gap-1.5 text-body-sm font-body-sm text-on-surface-variant mt-1">
<span>인증 메일이 오지 않았나요?</span>
<button class="text-primary hover:text-primary-fixed underline underline-offset-4 font-semibold active:opacity-75 transition-opacity" id="resendBtn" type="button">
        재전송 받기
      </button>
</div>
</div>
<!-- Peaceful Validation Micro-card -->
<div class="w-full bg-surface-container-low rounded-xl p-space-md flex items-start gap-space-sm mb-space-xl">
<span class="material-symbols-outlined text-primary text-[20px] shrink-0 mt-0.5">verified</span>
<div class="flex flex-col">
<p class="font-label-md text-label-md text-on-surface">유효시간 내에 인증번호를 입력해 주세요.</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
        <span data-k="mail_note">스팸 메일함으로 분류되었을 수 있으니 메일함을 확인해주세요.</span>
      </p>
</div>
</div>
<!-- Keypad Preview & Micro Pet Delight Note -->
<div class="w-full bg-surface-container/60 rounded-2xl p-space-md mb-6 flex items-center justify-between">
<div class="flex items-center gap-space-sm">
<div class="w-7 h-7 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[16px]">pets</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant" data-k="pet_note">햄스터가 쳇바퀴 옆에서 기다려요</span>
</div>
<span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
</div>
<div class="hidden flex items-start gap-1.5 mt-1 px-1 py-1.5 rounded-lg bg-error-container/30" id="verify-error"><span class="material-symbols-outlined text-[17px] text-error shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span><p class="font-body-sm text-body-sm text-on-error-container leading-tight" data-k="verify-error"></p></div>
<!-- Primary Sticky Bottom CTA -->
<div class="w-full mt-auto pt-space-xs">
<button class="w-full h-14 rounded-2xl bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform duration-150" id="submitCta" type="button">
<span data-k="cta">인증 완료 및 다음 (3/5)</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</main>
